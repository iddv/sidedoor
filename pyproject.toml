[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sidedoor"
version = "1.0.0"
description = "Test whether a coding agent gets secrets from the intended broker or sneaks around it"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
sidedoor = "sidedoor.cli:main"

[tool.setuptools]
packages = ["sidedoor"]
